<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jurassic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="act3.css" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/jurassic-park" rel="stylesheet">
  </head>
  <body>

    <div class="login-card">
      <img src="Images/JPLOGO.png" alt="Logo" class="logo">
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <input type="text" id="loginUsername" class="form-control" placeholder="Username" required>
          <div class="fb-error" id="loginUsernameError">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span></span>
          </div>
        </div>

        <div class="mb-3">
          <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
          <div class="fb-error" id="loginPasswordError">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span></span>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 options-row">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-login w-100">Login</button>

        <div class="text-center mt-3 register-text">
          <span>Don't have an account? </span>
          <a href="Act3page2.html" class="register-link">Register</a>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const loginForm = document.getElementById('loginForm');
      const loginUsername = document.getElementById('loginUsername');
      const loginPassword = document.getElementById('loginPassword');
      const loginUsernameError = document.getElementById('loginUsernameError');
      const loginPasswordError = document.getElementById('loginPasswordError');

      function showLoginError(input, box, message) {
        input.classList.add('is-invalid-fb');
        box.querySelector('span').textContent = message;
        box.classList.add('show');
      }

      function clearLoginError(input, box) {
        input.classList.remove('is-invalid-fb');
        box.classList.remove('show');
        box.querySelector('span').textContent = '';
      }

      ['input', 'keyup', 'change', 'blur'].forEach(evt => {
        loginUsername.addEventListener(evt, () => {
          if (loginUsername.value.trim().length > 0) clearLoginError(loginUsername, loginUsernameError);
        });
        loginPassword.addEventListener(evt, () => {
          if (loginPassword.value.length > 0) clearLoginError(loginPassword, loginPasswordError);
        });
      });

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        let valid = true;

        if (loginUsername.value.trim().length === 0) {
          showLoginError(loginUsername, loginUsernameError, 'Please enter your username or email.');
          valid = false;
        } else {
          clearLoginError(loginUsername, loginUsernameError);
        }

        if (loginPassword.value.length === 0) {
          showLoginError(loginPassword, loginPasswordError, 'Please enter your password.');
          valid = false;
        } else {
          clearLoginError(loginPassword, loginPasswordError);
        }

        if (valid) {
          window.location.href = 'Act4-Jurassic.html';
        }
      });
    </script>
  </body>
</html>
